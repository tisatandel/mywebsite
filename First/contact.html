<!DOCTYPE html>
<html>
<head>
<title>Contact ABC School</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<iframe src="header.html" class="header-frame"></iframe>


<section class="contact-hero">

<img src="images/contact-school.jpg">

<h1>Contact Us</h1>

</section>


<section class="contact-section">

<div class="contact-info">

<h2>Get In Touch</h2>

<p><b>Address:</b> ABC School, Main Road, Surat</p>
<p><b>Phone:</b> +91 9876543210</p>
<p><b>Email:</b> abcschool@gmail.com</p>

<img src="images/school-office.jpg">

</div>


<div class="contact-form">

<h2>Send Message</h2>
<form>
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Your Email" required>
<input type="text" placeholder="Subject">
<textarea placeholder="Your Message"></textarea>
<button type="submit">Send Message</button>
</form>
</div>
</section>
<iframe src="footer.html" class="footer-frame"></iframe>
</body>
</html>
